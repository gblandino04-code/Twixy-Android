name: Build Twixy Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Twixy Release APK
        run: ./gradlew assembleRelease
      - name: Rename APK to Twixy.apk
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" app/build/outputs/apk/release/Twixy.apk
      - name: Upload Twixy APK
        uses: actions/upload-artifact@v4
        with:
          name: Twixy-Android-APK
          path: app/build/outputs/apk/release/Twixy.apk
